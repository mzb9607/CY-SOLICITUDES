server:
  port: 8082
spring:
  application:
    name: "CY-SOLICITUDES"
  devtools:
    add-properties: false
  h2:
    console:
      enabled: true
      path: "/h2"
  profiles:
    include: null
management:
  endpoints:
    web:
      exposure:
        include: "health,prometheus"
  endpoint:
    health:
      probes:
        enabled: true
cors:
  allowed-origins: "http://localhost:4200,http://localhost:8082"
adapters:
  usuario-service:
    url: "http://localhost:8080"
  r2dbc:
    mysql:
      host: localhost
      port: 3306
      database: cy-solicitudes
      username: root
      password: admin